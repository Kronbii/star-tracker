[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startracker"
version = "0.1.0"
description = "Modelling and planning tools for an ESP32 barn-door star tracker"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rami Kronbi" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "skyfield>=1.45",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
startracker = "startracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]
