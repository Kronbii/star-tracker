# arduino-cli sketch project file: `arduino-cli compile firmware/star_tracker`
# uses this board by default. Tested with the Arduino-ESP32 core 3.3.11:
#   arduino-cli core install esp32:esp32@3.3.11 \
#     --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
