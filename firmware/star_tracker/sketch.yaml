# arduino-cli sketch project file.
#   arduino-cli compile firmware/star_tracker                 (default FQBN)
#   arduino-cli compile --profile esp32dev firmware/star_tracker  (pinned core)
default_fqbn: esp32:esp32:esp32
profiles:
  esp32dev:
    notes: ESP32-WROOM-32 DevKitC, Arduino-ESP32 core pinned to the tested version
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
